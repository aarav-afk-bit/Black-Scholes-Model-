services:
  - type: web
    name: options-terminal-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FRONTEND_ORIGIN
        value: "*"   # replace with your Vercel URL after the frontend is deployed, e.g. https://options-terminal.vercel.app
